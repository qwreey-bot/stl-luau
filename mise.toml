# 프로젝트 툴체인. quad(`qwreey/quad`)의 mise.toml 구성을 따릅니다.
#
# selene 은 2026-09-21 에 폐기했습니다 — `const` 를 파싱하지 못하고(0.31.0 이
# 최신이라 올릴 곳이 없음) `const` 채택이 우선이었습니다. 린트는 luau-analyze
# 의 것을 씁니다(`.luaurc` 의 `lint: *`).
#
# lune 은 의도적으로 없습니다. 이 저장소는 순수 luau 로만 실행/검증합니다
# (`.claude/base/architecture.md` 의 "런타임: 순수 luau" 절 참고).
#
# **luau 를 여기서 고정하는 이유**(2026-08-31): 타입 검사기를 `luau-lsp analyze`
# 에서 luau 배포판에 같이 오는 `luau-analyze` 로 바꿨습니다. 실행기와 체커가
# 같은 바이너리 묶음에서 나오므로, 고정하지 않으면 타입 진단 기준선(현재
# 301건)이 재현되지 않습니다. quad 는 luau 를 고정하지 않는데 그건 그쪽의
# 구멍이고, 여기서는 따라가지 않습니다.

[tools]
luau = "0.734"
"github:JohnnyMorganz/luau-lsp" = "1.69.0"
