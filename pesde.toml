name = "qwreey/stl_luau"
version = "0.1.0"
description = "Roblox 엔진 Luau용 표준 라이브러리 스타일 컨테이너/알고리즘 모음"
license = "MIT"
includes = ["pesde.toml", "src/**/*.luau", "LICENSE"]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

# [scripts] 는 의도적으로 비워둡니다 — pesde run 은 스크립트를 항상 Lune 으로
# 실행하는데, 이 저장소는 Lune 을 쓰지 않습니다. 테스트는 `luau tests/run.luau`
# 로 직접 실행하세요 (.claude/base/architecture.md 의 "런타임: 순수 luau" 절).
